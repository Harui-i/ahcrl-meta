[general]
version = "0.3.1"

[problem]
problem_name = "ahc063"
objective = "Min"
score_regex = '(?m)^\s*Score\s*=\s*(?P<score>\d+)\s*$'

[test]
start_seed = 0
end_seed = 100
threads = 0
out_dir = "./pahcer"

# ==============================
#         COMPILE STEPS
# ==============================

# Compile the user's program
[[test.compile_steps]]
program = "g++"
args = [
    "-std=c++20",
    "-O2",
    "-D_GLIBCXX_USE_CXX11_ABI=1",
    "-I",
    "../../../../.venv/lib/python3.13/site-packages/torch/include",
    "-I",
    "../../../../.venv/lib/python3.13/site-packages/torch/include/torch/csrc/api/include",
    "main.cpp",
    "-L",
    "../../../../.venv/lib/python3.13/site-packages/torch/lib",
    "-Wl,-rpath,$ORIGIN/../../../../.venv/lib/python3.13/site-packages/torch/lib",
    "-ltorch",
    "-ltorch_cpu",
    "-lc10",
]

# ==============================
#           TEST STEPS
# ==============================

# Run the user's program
[[test.test_steps]]
program = "./a.out"
args = []
stdin = "./tools/in/{SEED04}.txt"
stdout = "./tools/out/{SEED04}.txt"
stderr = "./tools/err/{SEED04}.txt"
measure_time = true

# Run the visualizer to calculate the score
[[test.test_steps]]
program = "cargo"
args = [
    "run",
    "--bin",
    "vis",
    "--release",
    "./in/{SEED04}.txt",
    "./out/{SEED04}.txt",
]
current_dir = "./tools"
measure_time = false

[training]
num_envs = 1024
total_steps = 20000000
rollout_steps = 256
seed_start = 0
seed_stride = 1
device = "cuda"
compile = true
artifact_dir = "contests/ahc-063/artifacts/ppo"
checkpoint_interval_updates = 40

[ppo]
lr = 0.0003
gamma = 0.995
gae_lambda = 0.95
clip = 0.2
epochs = 1
minibatch_size = 256
entropy_coef = 0.0001
value_coef = 0.5
max_grad_norm = 0.5

[wandb]
enabled = true
project = "ahcrl-meta-ahc063"
name = "ahc063-ezcur"

[model]
channels = 256
blocks = 2
block_type = "spherical_attention_simba"

[contest]
max_episode_steps = 256
reward_scale = true
obs_norm = true
obs_norm_epsilon = 1e-8
fixed_n = 8
fixed_m = 16
fixed_c = 3

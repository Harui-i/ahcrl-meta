[training]
optimizer = "adamw"
weight_decay = 0.01
modula_momentum = 0.95
modula_nesterov = true
modula_diagnostics_interval = 100
modula_initialize = true
modula_project = true
num_envs = 2
env_workers = 0
total_steps = 128
rollout_steps = 64
seed_start = 0
seed_stride = 1
device = "cpu"
compile = false
artifact_dir = "contests/ahc-061/artifacts/ppo"
checkpoint_interval_updates = 1

[ppo]
lr = 0.0003
gamma = 0.995
gae_lambda = 0.95
clip = 0.2
epochs = 4
minibatch_size = 1024
entropy_coef = 0.01
value_coef = 0.5
max_grad_norm = 0.5
reward_scale = true
obs_norm = true

[model]
channels = 64
blocks = 4

[contest]
fixed_m = 4
fixed_u = 3
pf_particles = 16

[training]
optimizer = "modula"
weight_decay = 0.01
modula_momentum = 0.95
modula_nesterov = true
modula_diagnostics_interval = 100
modula_initialize = true
modula_project = true
modula_target_kl = 0.03
num_envs = 1024
env_workers = 0
total_steps = 20000000
rollout_steps = 100
seed_start = 0
seed_stride = 1
device = "cuda"
compile = true
artifact_dir = "contests/ahc-061/artifacts/ppo_modula"
checkpoint_interval_updates = 40

[ppo]
# modula公式例では0.1. 自然ノルム1の方向にどれだけのサイズで更新するかの値で、大き目にする
lr = 0.3
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
epochs = 1
minibatch_size = 1024
entropy_coef = 0.0001
value_coef = 0.5
max_grad_norm = 0.5
proximal_ewma = true
proximal_ewma_com = 256.0
reward_scale = true
obs_norm = true
obs_norm_epsilon = 1e-8

[model]
channels = 256
blocks = 2

[contest]
pf_particles = 16

[wandb]
enabled = true
project = "ahcrl-meta-ahc061"
name = "ahc061-ppo-ewma-modula-com256"
tags = ["ahc061", "ppo-ewma", "ewma", "modula", "jiacheng-ns6"]

[training]
num_envs = 1024
total_steps = 20000000
rollout_steps = 100
seed_start = 0
seed_stride = 1
device = "cuda"
compile = true
artifact_dir = "contests/ahc-061/artifacts/ppo"
checkpoint_interval_updates = 40

[ppo]
lr = 0.0003
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
epochs = 1
minibatch_size = 1024
entropy_coef = 0.0001
value_coef = 0.5
max_grad_norm = 0.5
reward_scale = true
obs_norm = true
obs_norm_epsilon = 1e-8

[model]
channels = 256
blocks = 2
block_type = "spherical_attention_simba"

[contest]
pf_particles = 16

[wandb]
enabled = true
project = "ahcrl-meta-ahc061"
name = "ahc061-ppo"
tags = ["ahc061", "ppo"]

[package]
name = "ahc061-rl-tools"
version = "0.1.0"
edition = "2018"
autobins = false

[dependencies]
ahcrl-env-core = { path = "../../../crates/ahcrl-env-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tools = { path = "../tools" }

[[bin]]
name = "rl_env"
path = "src/bin/main.rs"

[profile.dev]
overflow-checks = false

[profile.test]
overflow-checks = false
